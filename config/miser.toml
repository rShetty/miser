host = "0.0.0.0"
port = 8787
api_key = ""
# Global cap on in-flight requests (default: 64).
# concurrency_limit = 64
# Per-request timeout in milliseconds, including time spent waiting for a
# concurrency permit (default: 30000).
# request_timeout_ms = 30000

[classifier]
mode = "jev"
stages = ["override", "structural", "heuristic", "jev", "local_llm", "cloud_llm"]
confidence_threshold = 0.65

[classifier.local_llm]
enabled = true
model = "qwen3:1.7b"
base_url = "http://127.0.0.1:11434/v1"
timeout_ms = 800

[classifier.cloud_llm]
enabled = true
model = "openai/gpt-4.1-mini"
base_url = "https://openrouter.ai/api/v1"
timeout_ms = 1500

# Jev (TypeSafe System One) evaluation endpoint. Talks the evaluation
# contract, not chat completions. Default path is /evaluate (Vercel AI
# Gateway); TypeSafe direct is /systemone with model jev-latest. The API key
# is resolved from JEV_API_KEY when left empty. With mode = "jev" the
# classifier routes every request through Jev; mode = "hybrid" does not
# consult this endpoint.
[classifier.jev]
enabled = true
model = "jev-latest"
base_url = "https://api.typesafe.ai/v1"
path = "/systemone"
timeout_ms = 3000

[quality]
enabled = true
minimum_score = 0.65
escalate_on_failure = true
# Jev (TypeSafe System One) as quality judge. Scores non-streaming responses
# for correctness, completeness, and relevance using a typed score question.
# Falls back to deterministic checks on failure. Key from JEV_API_KEY.
[quality.judge]
enabled = true
model = "jev-latest"
base_url = "https://api.typesafe.ai/v1"
path = "/systemone"
timeout_ms = 3000

[provider]
base_url = "https://openrouter.ai/api/v1"
api_key = ""
api_key_env = "OPENROUTER_API_KEY"

[provider.provider_preferences]
sort = "price"
allow_fallbacks = true

[routing]
# "catalog" partitions every OpenRouter model into the five tiers by input
# price and pins one model per tier; "fixed" uses [tiers.*].model verbatim.
mode = "catalog"
# Persisted snapshot (pins + full model->tier split). Loaded at startup;
# refreshed only via POST /admin/catalog/refresh.
cache_path = "catalog/models.json"
# First snapshot pins each tier to its configured [tiers.*].model, so
# enabling catalog mode changes nothing until an explicit refresh migrates
# a pin to a meaningfully cheaper candidate.
seed_from_config = true
# Refresh migrates a pin only when a candidate is at least 25% cheaper.
switch_saving_ratio = 0.25
# Consecutive upstream failures (5xx/429/transport) before a tier's active
# model is swapped for the next candidate (in-memory until restart).
failover_threshold = 3
refresh_on_start = false

[routing.bands]
# Input price bounds (USD per 1M prompt tokens). Defaults are geometric
# midpoints between the shipped tier anchor models.
trivial_max = 0.035
simple_max = 0.09
standard_max = 0.36
reasoning_max = 1.4

[routing.filters]
require_tools = true
min_context = 65536
allow_free = false

[session]
enabled = true
ttl_seconds = 1800
max_entries = 10000

[tiers.trivial]
model = "qwen/qwen3.7-flash"
max_tokens = 256

[tiers.simple]
model = "deepseek/deepseek-v4-flash"
max_tokens = 768

[tiers.standard]
model = "qwen/qwen3-coder-flash"
max_tokens = 1536

[tiers.hard]
model = "anthropic/claude-sonnet-4"
max_tokens = 3072

[tiers.reasoning]
model = "z-ai/glm-5.2"
max_tokens = 3072
