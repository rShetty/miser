host = "0.0.0.0"
port = 8787
api_key = ""

[classifier]
mode = "hybrid"
stages = ["override", "structural", "heuristic", "local_llm", "cloud_llm"]
confidence_threshold = 0.65

[classifier.local_llm]
enabled = true
model = "qwen3:1.7b"
base_url = "http://127.0.0.1:11434/v1"
timeout_ms = 800

[classifier.cloud_llm]
enabled = true
model = "openai/gpt-4.1-mini"
base_url = "https://openrouter.ai/api/v1"
timeout_ms = 1500

[quality]
enabled = false
minimum_score = 0.7
escalate_on_failure = false

[provider]
base_url = "https://openrouter.ai/api/v1"
api_key = ""
api_key_env = "OPENROUTER_API_KEY"

[provider.provider_preferences]
sort = "price"
allow_fallbacks = true

[tiers.trivial]
model = "qwen/qwen3.7-flash"
max_tokens = 512

[tiers.simple]
model = "deepseek/deepseek-v4-flash"
max_tokens = 1024

[tiers.standard]
model = "qwen/qwen3-coder-flash"
max_tokens = 2048

[tiers.hard]
model = "anthropic/claude-sonnet-4"
max_tokens = 4096

[tiers.reasoning]
model = "z-ai/glm-5.2"
max_tokens = 4096
