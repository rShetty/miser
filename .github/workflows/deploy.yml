name: Deploy Miser Gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miser-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Scan tracked files for credentials
        shell: bash
        run: |
          if git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|OPENROUTER_API_KEY[[:space:]]*=[[:space:]]*(sk-|openrouter)' -- ':!.github/workflows/deploy.yml' ':!README.md' ':!config/miser.env.example'; then
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (master)
      - name: Install security tooling
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Cargo audit
        run: cargo audit
      - name: Cargo deny
        run: cargo deny check advisories bans licenses sources
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
      - name: Install cargo-sbom
        run: cargo install cargo-sbom --locked
      - name: Generate SBOM (SPDX JSON)
        run: cargo sbom > miser.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miser-sbom-spdx
          path: miser.spdx.json

  deploy:
    needs: [verify, security, sbom]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail

            OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}"

            if [ ! -d /opt/miser/.git ]; then
              rm -rf /opt/miser
              git clone https://github.com/rShetty/miser.git /opt/miser
            fi

            cd /opt/miser
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Preserve existing env, update OPENROUTER_API_KEY
            if [ -f /etc/miser/miser.env ]; then
              cp /etc/miser/miser.env /etc/miser/miser.env.bak
            else
              : > /etc/miser/miser.env
            fi
            sed -i "s|^OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=${OPENROUTER_API_KEY}|" /etc/miser/miser.env
            grep -q "^OPENROUTER_API_KEY=" /etc/miser/miser.env || echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" >> /etc/miser/miser.env
            grep -q "^RUST_LOG=" /etc/miser/miser.env || echo "RUST_LOG=info" >> /etc/miser/miser.env
            grep -q "^MISER_KEYS_FILE=" /etc/miser/miser.env || echo "MISER_KEYS_FILE=/var/lib/miser/keys.json" >> /etc/miser/miser.env
            chmod 600 /etc/miser/miser.env

            # Copy config
            cp config/miser.toml /etc/miser/miser.toml

            # Build
            source "$HOME/.cargo/env"
            cargo build --release -p miser-gateway -p miser-evals

            # Install binaries
            install -m 755 target/release/miser-gateway /usr/local/bin/miser-gateway
            install -m 755 target/release/miser-evals /usr/local/bin/miser-evals

            # Ensure user and key store
            id miser >/dev/null 2>&1 || useradd --system --home-dir /var/lib/miser --create-home --shell /usr/sbin/nologin miser
            mkdir -p /var/lib/miser
            chown miser:miser /var/lib/miser
            if [ ! -f /var/lib/miser/keys.json ]; then
              echo '{"keys":[]}' > /var/lib/miser/keys.json
              chown miser:miser /var/lib/miser/keys.json
              chmod 600 /var/lib/miser/keys.json
            fi

            # Install systemd unit
            cp deploy/miser.service /etc/systemd/system/miser.service
            systemctl daemon-reload
            systemctl enable miser
            systemctl restart miser

            # Health check with retries
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://127.0.0.1:8787/health/live; then
                echo ""
                echo "DEPLOY SUCCESS: miser.rajeev.me is healthy"
                exit 0
              fi
              echo "Health check attempt $i failed, waiting..."
              sleep 5
            done

            echo "ERROR: Health check failed"
            journalctl -u miser -n 30 --no-pager
            exit 1

      - name: Retry deploy (1)
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail
            source "$HOME/.cargo/env"
            cd /opt/miser
            git fetch origin main
            git reset --hard origin/main
            cargo build --release -p miser-gateway -p miser-evals
            install -m 755 target/release/miser-gateway /usr/local/bin/miser-gateway
            install -m 755 target/release/miser-evals /usr/local/bin/miser-evals
            cp config/miser.toml /etc/miser/miser.toml
            cp deploy/miser.service /etc/systemd/system/miser.service
            systemctl daemon-reload
            systemctl restart miser
            sleep 5
            curl -sf http://127.0.0.1:8787/health/live && echo "DEPLOY SUCCESS (retry 1)" || (journalctl -u miser -n 20 --no-pager && exit 1)

      - name: Retry deploy (2)
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail
            source "$HOME/.cargo/env"
            cd /opt/miser
            systemctl restart miser
            sleep 5
            curl -sf http://127.0.0.1:8787/health/live && echo "DEPLOY SUCCESS (retry 2)" || (journalctl -u miser -n 20 --no-pager && exit 1)
