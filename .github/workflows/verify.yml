name: Verify

# Tiered deliberately, per docs/SPEC.md section 8.
#
#   PR-blocking:  fmt, clippy, cargo test, proptest seeds
#   nightly:      Kani, TLC (TLA+), mutation testing
#
# Kani and TLC are slow and occasionally time out. Making them block every PR
# trains people to retry rather than to fix, and a red build on a timeout reads
# as "the prover is broken" rather than "the property is violated". They run
# nightly instead, and a *violated property* is escalated loudly by that job --
# only timeouts are silent.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC nightly. Off the hour so it does not collide with every other
    # scheduled job on the platform.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name is in the group on purpose.
  #
  # A manual `workflow_dispatch` and a `push` to the same ref are different
  # requests: one is "run the full verification now", the other is "the fast
  # gates on this commit". Grouping them together with `cancel-in-progress`
  # meant that pushing a commit silently killed a verification run that had
  # been going for forty minutes -- which is exactly what a nightly job that
  # takes hours is for. It has now happened three times, each time discarding a
  # mutation run that was nowhere near finished.
  #
  # Two dispatches still cancel each other (correct: no reason to run the same
  # slow checks twice concurrently) and two pushes still cancel each other
  # (correct: only the newest commit matters for fast gates).
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # proptest's own failure files are the regression corpus; keep them.
  PROPTEST_CASES: "512"

jobs:
  # ---------------------------------------------------------------- fast ----
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint workflow files
        # An invalid workflow file is a run that reports `failure` with *zero
        # jobs*. There is no failing step to read, so it is easy to misread as
        # a flaky infrastructure failure and re-run instead of fixing. It
        # happened here: interpolating a shell variable into a GitHub
        # expression (`${{ steps.${step}.outcome }}`) is not valid expression
        # syntax, the whole file failed to validate, and the run looked like a
        # repo problem rather than a config problem.
        #
        # Linting it here makes it a fast, blocking, readable failure instead.
        run: |
          curl -sSfL --max-time 120 https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.12
          ./actionlint
      - name: Build with warnings denied
        # `cargo build` has no `--` passthrough for rustc flags -- only
        # `cargo clippy` and `cargo rustc` do. Written the obvious way, this
        # step exits 1 on "unexpected argument '-D' found" and fails the whole
        # job. It did exactly that on this workflow's first ever run, and
        # because the nightly jobs below had `needs: [lint, test]`, that typo
        # silently skipped all four verification layers. The bug and the fix
        # that hid it are recorded in SPEC.md section 9.
        run: cargo build --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the suite
        run: cargo test --workspace --all-targets
      - name: The two live-contract tests stay ignored
        # `tests/jev_contract.rs::live_jev_contract` and
        # `tests/security.rs::live_security_screen_agrees` need JEV_API_KEY and
        # the network. They are the only coverage of the real provider's response
        # shape, so at least one of them runs weekly in the nightly job.
        run: |
          if cargo test --workspace -- --ignored --list 2>/dev/null | grep -q 'live_jev_contract'; then
            echo "live tests are correctly still #[ignore]d"
          else
            echo "::warning::a live-contract test is no longer #[ignore]d; re-check the nightly live job"
          fi

  corpora:
    name: Corpus accuracy floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The classifier corpus gates are ordinary tests, but re-running the
      # evaluator prints the numbers that docs/EVALUATION.md quotes, so a drift
      # in accuracy shows up as a diff rather than as a silently stale table.
      - name: Curated corpus
        run: cargo run -p miser-evals -- --corpus evals/cases.jsonl --mode heuristic
      - name: Held-out corpus
        run: cargo run -p miser-evals -- --corpus evals/classifier_cases.jsonl --mode heuristic
      - name: Generated corpus
        run: cargo run -p miser-evals -- --corpus evals/classifier_cases_large.jsonl --mode heuristic

  # -------------------------------------------------------------- nightly ----

  kani:
    name: Kani ${{ matrix.crate }}
    strategy:
      # Not `true`. The default cancels sibling jobs the moment one fails, which
      # is precisely how 0.68.0's ICE on miser-classifier suppressed
      # miser-types and left us with no result for either.
      fail-fast: false
      matrix:
        # Only crates that actually have `#[kani::proof]` functions. A crate
        # without them exits 0 and shows a green row that verified nothing --
        # miser-policy was in this list until it was caught doing that.
        crate: [miser-types, miser-classifier]
    # Only on x86_64. Kani has no aarch64 Linux build, which is why these
    # harnesses cannot be executed on every development machine.
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: [lint, test]`.
    #
    # With that dependency, one typo in a fast gate skips every slow gate -- and
    # a skipped verification job is indistinguishable from a passing one in the
    # run list. That is not hypothetical: the first run of this workflow failed
    # on a malformed `cargo build` line and consequently reported Kani, TLC,
    # cargo-mutants and the live contract as *skipped* rather than failed. The
    # whole verification program was disabled by a shell-argument error, and the
    # only symptom was four green-looking rows.
    #
    # These jobs are already gated on `schedule || workflow_dispatch`, so they
    # never run on an ordinary push anyway; making them depend on the fast gates
    # bought nothing and cost the visibility.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      # Kani pins its own toolchain; the action installs the verifier and the
      # matching nightly.
      - uses: model-checking/kani-github-action@v1
        with:
          # Pinned. The default is `latest`, which makes an upstream regression
          # indistinguishable from a defect in this repo: a Kani release that
          # ICEs would turn this job red on a commit that changed no proof.
          # Bump deliberately, in its own commit, with the ICE text in it.
          kani-version: '0.68.0'
          working-directory: .
          # The action is not only an installer. It has its own final step,
          # "Run Kani", which executes `command args` -- so with the default
          # `command: cargo-kani` and empty `args` it ran `cargo kani` over the
          # whole workspace the moment it was used, before the harness step
          # below had run. That is where the ICE was actually happening, which
          # is why the job failed without `ci/kani-prove.sh` ever being reached
          # and why no `::error` annotation from it appeared in the log.
          #
          # `true` makes the action's own "Run Kani" step a no-op. It has no
          # "install only" mode: the step is unconditional, so the only way to
          # stop it verifying the whole workspace is to hand it a command that
          # does nothing. (An earlier attempt used `cargo kani --list`, which
          # 0.68.0 does not have -- it exited 2 with "unexpected argument" and
          # failed the job before the matrix legs ran.)
          command: true
      # One step per crate, each `continue-on-error`, then an explicit gate.
      #
      # Not because a failure should be tolerated -- it is not, the gate below
      # re-fails the job -- but because 0.68.0 ICEs while compiling
      # miser-classifier, and a hard failure there meant the crate we could not
      # prove was never attempted, so a single upstream bug hid every result
      # this job exists to produce. Same reasoning as dropping `needs:` above.
      # The script is what guarantees a run means something; the matrix is what
      # guarantees we find out. `fail-fast: false` lets both crates be attempted
      # even when one fails, so an upstream ICE in one crate cannot hide the
      # other's result -- each is a separate job with its own conclusion, which
      # a single job with sequential steps cannot give you.
      #
      # (The previous version aggregated with a shell loop that interpolated a
      # shell variable into a GitHub expression. The expression language has no
      # shell interpolation, so the workflow failed to validate and ran zero
      # jobs while reporting `failure`.)
      - name: Prove
        run: bash ci/kani-prove.sh '${{ matrix.crate }}'
      # No `miser-policy` step. It ran `cargo kani -p miser-policy`, and that
      # crate has no `#[kani::proof]` functions -- so it exited 0 and the run
      # list showed a third green verification layer that verified nothing.
      # A row here was a claim, not a result.
      - name: Upload proofs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Unique per matrix leg. With a shared name the two legs race to
          # upload the same artifact name and one set of proofs is lost -- the
          # first version of this job did exactly that.
          name: kani-proofs-${{ matrix.crate }}
          path: |
            target/kani/
            kani-*.log
          retention-days: 30

  tlc:
    name: TLA+ model checking
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: [lint, test]`.
    #
    # With that dependency, one typo in a fast gate skips every slow gate -- and
    # a skipped verification job is indistinguishable from a passing one in the
    # run list. That is not hypothetical: the first run of this workflow failed
    # on a malformed `cargo build` line and consequently reported Kani, TLC,
    # cargo-mutants and the live contract as *skipped* rather than failed. The
    # whole verification program was disabled by a shell-argument error, and the
    # only symptom was four green-looking rows.
    #
    # These jobs are already gated on `schedule || workflow_dispatch`, so they
    # never run on an ordinary push anyway; making them depend on the fast gates
    # bought nothing and cost the visibility.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch tla2tools
        run: |
          mkdir -p tla
          curl -sSL -o tla/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Check the authorization-ordering model
        # P8: no control is reachable only on the cache-miss path. This is the
        # property whose violation was defect 3, and the reason for modelling the
        # handler as a state machine rather than testing it pairwise.
        run: |
          java -cp tla/tla2tools.jar tlc2.TLC \
            -config spec/AuthorizationOrdering.cfg \
            -workers auto \
            -deadlock \
            spec/AuthorizationOrdering.tla
      - name: Confirm the model still detects the pre-fix defect
        # EXPECTED TO FAIL. If this ever passes, the model has stopped
        # discriminating and the gate above is worthless. So the result is
        # inverted: green here means the harness is broken.
        run: |
          # The command sits in the `if` condition, so its non-zero exit is the
          # expected path rather than an error, and `set -e` does not apply to
          # it. The previous `set +e` + `if [ $? -eq 0 ]` reached the same place
          # but disabled error checking for the whole step, and $? is read after
          # the `if`, where it can already have been clobbered.
          if java -cp tla/tla2tools.jar tlc2.TLC \
               -config spec/AuthorizationOrderingPrefix.cfg \
               -workers auto \
               spec/AuthorizationOrdering.tla; then
            echo "::error::the pre-fix model PASSED; the authorization model no longer detects the defect class"
            exit 1
          fi
          echo "the pre-fix model still fails, as it must"

  mutants:
    name: Mutation kill rate ${{ matrix.shard }}/4 (of 0-3)
    strategy:
      # Same reasoning as the Kani job: the default cancels siblings on the
      # first failure, which for an hours-long job throws away the shards that
      # were nearly done.
      fail-fast: false
      matrix:
        # 0-indexed: `--shard 4/4` is rejected with "shard k must be less than
        # n", so a 1-based list fails one leg outright and silently never runs
        # shard 0. Verified: shards 0-3 yield 80+80+80+78 = 318, the full set.
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: [lint, test]`.
    #
    # With that dependency, one typo in a fast gate skips every slow gate -- and
    # a skipped verification job is indistinguishable from a passing one in the
    # run list. That is not hypothetical: the first run of this workflow failed
    # on a malformed `cargo build` line and consequently reported Kani, TLC,
    # cargo-mutants and the live contract as *skipped* rather than failed. The
    # whole verification program was disabled by a shell-argument error, and the
    # only symptom was four green-looking rows.
    #
    # These jobs are already gated on `schedule || workflow_dispatch`, so they
    # never run on an ordinary push anyway; making them depend on the fast gates
    # bought nothing and cost the visibility.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Count the mutants under test
        # Recorded so a partial result is still interpretable. The kill rate is
        # only meaningful against the number of mutants that were in scope; a
        # run that dies at 60% of 318 is a very different statement from one
        # that dies at 60% of 200, and a shrinking `examine_globs` list would
        # otherwise silently change the denominator between runs.
        run: cargo mutants --list | tee mutants-listed.txt | tail -1
      - name: Mutate the decision core
        # cargo-mutants 27.1 has no minimum-sample flag -- the only `--min*`
        # option is --minimum-test-timeout, which .cargo/mutants.toml already
        # sets. The sample-size floor an earlier comment here claimed does not
        # exist, so it is not faked.
        #
        # Sharded with `--shard i/N` because 318 mutants will not finish inside
        # GitHub's 6h job limit, and a run that hits the limit yields no kill
        # rate at all. The shards are complementary, so their reports combine
        # into one number, and a shard that fails no longer discards the ones
        # that succeeded. Confirmed against `cargo mutants --help` in 27.1
        # rather than assumed.
        run: |
          # A shard that dies partway prints no kill rate at all, and three
          # surviving shards look like a complete run. Echo the shard and the
          # expected mutant count up front so a partial result is labelled as
          # one in the log rather than being read as a total.
          echo "shard ${{ matrix.shard }} of 4; total mutants: $(grep -c . mutants-listed.txt)"
          cargo mutants -j 2 --timeout 300 --shard '${{ matrix.shard }}/4'
      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surviving-mutants-${{ matrix.shard }}
          path: |
            mutants/
            mutants-listed.txt
          retention-days: 30
      - name: Upload the surviving-mutant report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surviving-mutants
          path: mutants/
          retention-days: 30

  live-contract:
    name: Live Jev contract
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: [lint, test]`.
    #
    # With that dependency, one typo in a fast gate skips every slow gate -- and
    # a skipped verification job is indistinguishable from a passing one in the
    # run list. That is not hypothetical: the first run of this workflow failed
    # on a malformed `cargo build` line and consequently reported Kani, TLC,
    # cargo-mutants and the live contract as *skipped* rather than failed. The
    # whole verification program was disabled by a shell-argument error, and the
    # only symptom was four green-looking rows.
    #
    # These jobs are already gated on `schedule || workflow_dispatch`, so they
    # never run on an ordinary push anyway; making them depend on the fast gates
    # bought nothing and cost the visibility.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The only coverage of the real provider's response shape, and the only
    # coverage of the real security-screen wording. Skipped rather than failed
    # when the secret is absent, so a fork still gets a green run.
    #
    # The key is bound at *job* level, not step level. A step's own `env` block
    # is not in scope for that step's `if`, so
    #
    #     - if: env.JEV_API_KEY != ''
    #       env: { JEV_API_KEY: ... }
    #
    # evaluates the condition against an empty env and skips the step even when
    # the secret is set. A job-level `env` is what makes the guard see the value.
    # That mistake would have made this job permanently green and permanently
    # silent, which is the worst possible failure for the one layer that has
    # never been exercised.
    env:
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the ignored live tests
        if: env.JEV_API_KEY != ''
        run: cargo test --workspace -- --ignored --nocapture
