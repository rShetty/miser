# ONE-OFF: revoke the auth key that leaked into this public repo's Actions log,
# and mint a replacement delivered ONLY as RSA-encrypted ciphertext (the
# private key lives on the operator's laptop, never in this repo). Delete
# after use.
name: ops-tailnet-fix
on:
  workflow_dispatch:
    inputs:
      revoke_key_id:
        description: "Key id to revoke (the leaked one); empty to skip"
        required: false
        default: "kBNLvYrQ4o11CNTRL"
      pubkey_der_b64:
        description: "base64 of the operator RSA public key (DER SubjectPublicKeyInfo)"
        required: true

permissions:
  contents: read

concurrency:
  group: ops-tailnet-fix
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      REVOKE_KEY_ID: ${{ github.event.inputs.revoke_key_id }}
      PUBKEY_DER_B64: ${{ github.event.inputs.pubkey_der_b64 }}
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:hostinger

      - name: Revoke leaked key, mint replacement (encrypted output only)
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -X POST "https://api.tailscale.com/api/v2/oauth/token" \
            --data-urlencode "client_id=$TS_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_OAUTH_SECRET" | jq -r '.access_token')
          [ "$TOKEN" != "null" ] && [ -n "$TOKEN" ] || { echo "OAuth token fetch failed"; exit 1; }

          # Revoke every listed key (comma-separated). Empty input skips.
          for KID in $(echo "$REVOKE_KEY_ID" | tr ',' ' '); do
            [ -n "$KID" ] || continue
            HTTP=$(curl -s -o .rev -w '%{http_code}' -X DELETE \
              "https://api.tailscale.com/api/v2/tailnet/-/keys/$KID" \
              -H "Authorization: Bearer $TOKEN")
            echo "revoke $KID -> http=$HTTP $(cat .rev 2>/dev/null || true)"
          done

          # No pubkey supplied -> revoke-only mode, nothing is minted.
          [ -n "$PUBKEY_DER_B64" ] || { echo "revoke-only run complete"; exit 0; }

          HTTP=$(curl -s -o authkey.json -w '%{http_code}' \
            -X POST "https://api.tailscale.com/api/v2/tailnet/-/keys" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"keyType":"auth","description":"srv1542935 reauth oneoff",
                 "capabilities":{"devices":{"create":{"reusable":true,"ephemeral":false,
                 "preauthorized":true,"tags":["tag:hostinger"]}}}}')
          [ "$HTTP" = "200" ] || { echo "auth key create failed http=$HTTP"; cat authkey.json; exit 1; }

          # NEVER echo the raw key. Encrypt to the operator's public key and
          # print only ciphertext.
          echo "$PUBKEY_DER_B64" | base64 -d > pub.der
          openssl pkey -pubin -inform DER -in pub.der -out pub.pem
          CIPHER=$(jq -r '.key' authkey.json | openssl pkeyutl -encrypt -pubin -inkey pub.pem | base64 -w0)
          KEY_ID=$(jq -r '.id' authkey.json)
          rm -f authkey.json pub.der pub.pem .rev
          echo ""
          echo "NEW_KEY_ID=$KEY_ID"
          echo "CIPHERTEXT_B64:"
          echo "$CIPHER"
