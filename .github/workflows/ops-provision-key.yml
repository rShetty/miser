# ONE-OFF ops run: revive the VPS tailnet node (expired node key) and provision
# a client key. Delete after use.
#
# The raw client secret never transits GitHub: the caller generates it locally
# and passes only its SHA-256 hash, which is appended to
# /var/lib/miser/keys.json on the VPS. The entry mirrors auth.rs exactly (the
# gateway strips `miser_`, hashes with SHA-256, and matches constant-time).
name: ops-provision-key
on:
  workflow_dispatch:
    inputs:
      key_hash:
        description: "SHA-256 hex of the miser_-stripped client secret"
        required: true
      key_id:
        description: "Key id, e.g. key_opencode2"
        required: true
      owner:
        description: "Owner attribution for usage rollup"
        required: false
        default: "rshetty"
      client:
        description: "Client label for usage rollup"
        required: false
        default: "opencode2"

permissions:
  contents: read

concurrency:
  group: ops-provision-key
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:hostinger
          # NOTE: no `ping` -- the VPS node key is expired; the ping would fail
          # the step before the revive steps below can run.

      - name: Revive VPS node via Tailscale API
        run: |
          set -uo pipefail
          TOKEN=$(curl -s -X POST "https://api.tailscale.com/api/v2/oauth/token" \
            --data-urlencode "client_id=$TS_OAUTH_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_OAUTH_SECRET" | jq -r '.access_token')
          [ "$TOKEN" != "null" ] && [ -n "$TOKEN" ] || { echo "OAuth token fetch failed"; exit 1; }

          curl -sf -H "Authorization: Bearer $TOKEN" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices" > devices.json

          # Diagnostics: non-secret fields only. Tells us exactly why an API
          # mutation was refused and whether Tailscale SSH is even possible.
          echo "=== tailnet devices (diagnostics) ==="
          jq -r '.devices[] |
            [.name, .nodeId, (.tags // [] | join(",")), .os,
             ((.isEphemeral // false) | tostring),
             ((.connectedToControl // false) | tostring),
             (.expires // "?"),
             ((.keyExpiryDisabled // false) | tostring)]
            | @tsv' devices.json
          echo "====================================="

          # The runner ALSO joins the tailnet (ephemeral, tagged). The VPS is
          # the long-lived Linux node -- srv1542935 in this tailnet -- whose
          # node key expired 2026-09-28T13:07Z. The personal devices
          # (macbooks, iphone) are neither linux nor ephemeral-runner, so
          # "non-ephemeral + linux" isolates exactly the VPS.
          NODE_ID=$(jq -r '
            [ .devices[]
            | select(((.isEphemeral // false) | not))
            | select(.os == "linux")
            | .nodeId ]
            | if length == 1 then .[0]
              elif length == 0 then ""
              else "AMBIGUOUS:" + (join(","))
              end' devices.json)
          echo "nodeId=$NODE_ID"
          case "$NODE_ID" in
            ""|AMBIGUOUS:*) echo "candidate selection failed: $NODE_ID"; exit 1 ;;
          esac

          api() { # method path body -> http body
            local method=$1 path=$2 body=${3:-}
            if [ -n "$body" ]; then
              curl -s -o .api_body -w '%{http_code}' -X "$method" \
                "https://api.tailscale.com/api/v2$path" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" -d "$body"
            else
              curl -s -o .api_body -w '%{http_code}' -X "$method" \
                "https://api.tailscale.com/api/v2$path" \
                -H "Authorization: Bearer $TOKEN"
            fi
          }

          # 1. Try tagging the VPS node as tag:hostinger. A tagged OAuth actor
          #    may only manage devices sharing its tags, so this can unlock
          #    step 2. Harmless if the tag is already present.
          HTTP=$(api POST "/device/$NODE_ID/tags" '{"tags":["tag:hostinger"]}')
          echo "set-tags http=$HTTP $(cat .api_body 2>/dev/null || true)"

          # 2. Disable node key expiry (documented recovery for expired keys).
          HTTP=$(api POST "/device/$NODE_ID/key" '{"keyExpiryDisabled": true}')
          echo "key-expiry-disable http=$HTTP $(cat .api_body 2>/dev/null || true)"

          if [ "$HTTP" != "200" ]; then
            echo ""
            echo "API path refused (actor lacks devices:core or tag ownership)."
            echo "The node key must be renewed from the Tailscale admin console"
            echo "(login.tailscale.com/admin/machines -> VPS -> reauthenticate/"
            echo "disable key expiry) or with an API token that has devices:core."
            exit 1
          fi

      - name: Wait for VPS to rejoin the tailnet
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if sudo tailscale ping -c1 --timeout=5s "$VPS_HOST" >/dev/null 2>&1; then
              echo "VPS reachable over tailnet (attempt $i)"
              exit 0
            fi
            sleep 5
          done
          echo "VPS still unreachable after 3 minutes"; exit 1

      - name: Append key to VPS store and restart gateway
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 5m
          envs: KEY_HASH,KEY_ID,KEY_OWNER,KEY_CLIENT
          script: |
            set -euo pipefail

            STORE=/var/lib/miser/keys.json

            if [ ! -f "$STORE" ]; then
              echo "ABORT: $STORE not found"; exit 1
            fi

            cp "$STORE" "${STORE}.bak-provision"
            chmod 600 "${STORE}.bak-provision"

            if python3 -c "import json,sys; sys.exit(0 if any(k['id']=='$KEY_ID' for k in json.load(open('$STORE'))['keys']) else 1)"; then
              echo "ABORT: key id $KEY_ID already exists in $STORE"; exit 1
            fi

            python3 - "$STORE" <<'PYEOF'
            import json, sys, time, os

            store, = sys.argv[1:]
            with open(store) as f:
                data = json.load(f)

            entry = {
                "id": os.environ["KEY_ID"],
                "key_hash": os.environ["KEY_HASH"],
                "owner": os.environ["KEY_OWNER"],
                "client": os.environ["KEY_CLIENT"],
                "created_at": int(time.time()),
                "active": True,
                "allowed_tiers": [],
                "rate_limit_rpm": None,
                "monthly_budget_usd": None,
                "expires_at": None,
            }
            data["keys"].append(entry)

            tmp = store + ".tmp"
            with open(tmp, "w") as f:
                json.dump(data, f, indent=2)
                f.write("\n")
            json.load(open(tmp))          # validate before installing
            os.replace(tmp, store)
            PYEOF

            chown miser:miser "$STORE"
            chmod 600 "$STORE"

            systemctl restart miser
            sleep 5
            curl -sf http://127.0.0.1:8787/health/live
            echo ""
            echo "PROVISION OK: key_id=$KEY_ID client=$KEY_CLIENT"
            echo "keys in store: $(python3 -c "import json;print(len(json.load(open('$STORE'))['keys']))")"
        env:
          KEY_HASH: ${{ github.event.inputs.key_hash }}
          KEY_ID: ${{ github.event.inputs.key_id }}
          KEY_OWNER: ${{ github.event.inputs.owner }}
          KEY_CLIENT: ${{ github.event.inputs.client }}
